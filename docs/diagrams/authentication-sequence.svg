<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" role="img" aria-label="Authentication sequence thumbnail">
<rect width="480" height="270" fill="#fff4e0"/>
<text x="240" y="30" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold">15m access + 7d rotating refresh</text>
<circle cx="80" cy="90" r="26" fill="#41ab5d"/><text x="80" y="95" text-anchor="middle" fill="#fff" font-size="12">login</text>
<text x="150" y="95" font-size="18">→</text>
<circle cx="220" cy="90" r="26" fill="#646cff"/><text x="220" y="95" text-anchor="middle" fill="#fff" font-size="12">rotate</text>
<text x="290" y="95" font-size="18">→</text>
<circle cx="360" cy="90" r="26" fill="#41ab5d"/><text x="360" y="95" text-anchor="middle" fill="#fff" font-size="12">reuse?</text>
<rect x="60" y="140" width="360" height="44" rx="8" fill="#d62728"/><text x="240" y="167" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="14">reuse → revoke whole family</text>
<rect x="60" y="194" width="360" height="44" rx="8" fill="#d62728"/><text x="240" y="221" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="14">password change → invalidate</text>
</svg>
